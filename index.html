<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お絵かきCR レギュレーションチェッカー</title>
<style>
:root {
  --brand: #6C47FF;
  --brand-g: linear-gradient(135deg,#6C47FF,#9B59B6);
  --ok: #059669; --ok-bg: #ECFDF5; --ok-b: #A7F3D0;
  --fail: #DC2626; --fail-bg: #FEF2F2; --fail-b: #FECACA;
  --warn: #D97706; --warn-bg: #FFFBEB; --warn-b: #FDE68A;
  --bg: #F0F2F8;
  --surface: #FFFFFF;
  --text: #0F172A;
  --sub: #64748B;
  --border: #E2E8F0;
  --r: 16px; --r-sm: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0F0C29,#302B63,#24243E);padding:36px 24px 32px;text-align:center;position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,rgba(108,71,255,.25) 0%,transparent 60%);pointer-events:none;}
.hdr-inner{position:relative;max-width:780px;margin:0 auto;}
.hdr-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);color:rgba(255,255,255,.85);font-size:11px;font-weight:600;letter-spacing:1.2px;padding:5px 14px;border-radius:20px;margin-bottom:16px;}
.hdr h1{font-size:28px;font-weight:800;color:#FFF;letter-spacing:-0.5px;margin-bottom:6px;}
.hdr p{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.3px;}

/* ── LAYOUT ── */
.main{max-width:780px;margin:0 auto;padding:28px 20px 80px;}

/* ── CARD ── */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:24px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.06);}
.clabel{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;}

/* ── MEDIA TABS ── */
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px;}
.tab:hover{border-color:var(--brand);color:var(--brand);}
.tab.on{border-color:var(--brand);background:#F0EBFF;color:var(--brand);font-weight:700;}
.hint{margin-top:10px;font-size:12px;color:var(--sub);background:#F8FAFC;padding:9px 13px;border-radius:8px;line-height:1.6;border-left:3px solid var(--brand);}

/* ── PLATFORM CARDS ── */
.pf-row{display:flex;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap;}
.pf-label{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;width:100%;margin-bottom:2px;}
.pf-card{flex:1;min-width:160px;border-radius:14px;border:2px solid var(--border);padding:16px 18px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:12px;background:#fff;position:relative;overflow:hidden;user-select:none;}
.pf-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .18s;}
.pf-card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.1);}

.pf-card.x-card.on{border-color:#000;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.pf-card.x-card::before{background:linear-gradient(135deg,#1a1a1a,#000);}
.pf-card.x-card:hover{border-color:#333;}

.pf-card.meta-card.on{border-color:#1877F2;background:linear-gradient(135deg,#1877F2,#166FE5);box-shadow:0 6px 24px rgba(24,119,242,.35);}
.pf-card.meta-card:hover{border-color:#1877F2;}

.pf-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;}
.x-card .pf-icon{background:#111;}
.x-card.on .pf-icon{background:rgba(255,255,255,.12);}
.meta-card .pf-icon{background:#1877F2;}
.meta-card.on .pf-icon{background:rgba(255,255,255,.2);}

.pf-info{flex:1;}
.pf-name{font-size:13px;font-weight:700;color:var(--text);transition:color .18s;}
.pf-desc{font-size:11px;color:var(--sub);margin-top:2px;transition:color .18s;}
.x-card.on .pf-name,.x-card.on .pf-desc{color:#fff;}
.meta-card.on .pf-name,.meta-card.on .pf-desc{color:#fff;}

.pf-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .18s;flex-shrink:0;}
.x-card.on .pf-check{background:#fff;border-color:#fff;color:#000;}
.meta-card.on .pf-check{background:#fff;border-color:#fff;color:#1877F2;}

/* ── INPUT ── */
.inp{width:100%;min-height:160px;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;font-size:14px;font-family:inherit;line-height:1.8;resize:vertical;transition:border .15s;outline:none;color:var(--text);background:#FAFBFD;}
.inp:focus{border-color:var(--brand);background:#fff;}
.inp::placeholder{color:#C8CDD8;}

/* ── VIDEO INPUT ── */
.video-inp{display:none;flex-direction:column;gap:14px;}
/* source selector */
.src-tabs{display:flex;gap:8px;}
.src-tab{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.src-tab:hover{border-color:var(--brand);color:var(--brand);}
.src-tab.on{border-color:var(--brand);background:#F0EBFF;color:var(--brand);}
/* url input */
.url-wrap{display:flex;gap:10px;}
.url-field{flex:1;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:#FAFBFD;transition:border .15s;}
.url-field:focus{border-color:var(--brand);background:#fff;}
.url-field::placeholder{color:#C8CDD8;}
.fetch-btn{padding:12px 20px;background:linear-gradient(135deg,#6C47FF,#9B59B6);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s,transform .1s;}
.fetch-btn:hover{opacity:.9;transform:translateY(-1px);}
.fetch-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
/* file drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .15s;position:relative;display:none;}
.drop-zone:hover,.drop-zone.over{border-color:var(--brand);background:#F8F5FF;}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-icon{font-size:36px;margin-bottom:10px;}
.drop-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;}
.drop-sub{font-size:12px;color:var(--sub);}
.drop-sub strong{color:var(--brand);}
/* preview */
.vid-preview{display:none;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:none;display:block;}
.vid-preview video{object-fit:contain;}
/* status / transcript */
.fetch-status{font-size:12px;padding:10px 14px;border-radius:8px;display:none;}
.fetch-status.loading{background:#EEF2FF;color:#4338CA;}
.fetch-status.ok{background:var(--ok-bg);color:var(--ok);}
.fetch-status.ng{background:#FFF3CD;color:#92400E;}
.transcript-area{display:none;}
.transcript-area textarea{width:100%;min-height:120px;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;font-size:13px;font-family:inherit;line-height:1.7;resize:vertical;outline:none;color:var(--text);background:#FAFBFD;}
.transcript-area textarea:focus{border-color:var(--brand);}
.transcript-label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;}

/* ── BTN ── */
.go-btn{width:100%;padding:15px;background:linear-gradient(135deg,#6C47FF 0%,#5B8DEF 100%);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;letter-spacing:.2px;transition:transform .12s,box-shadow .12s;box-shadow:0 4px 14px rgba(108,71,255,.35);}
.go-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,71,255,.45);}
.go-btn:active{transform:translateY(0);}

/* ── RESULT ── */
.result{display:none;}
.pass-all{text-align:center;padding:32px 24px;background:linear-gradient(135deg,var(--ok-bg),#D1FAE5);border-radius:14px;border:2px solid var(--ok-b);}
.pass-all .e{font-size:48px;margin-bottom:12px;}
.pass-all h3{font-size:20px;font-weight:800;color:var(--ok);}
.pass-all p{font-size:13px;color:#065F46;margin-top:5px;}

/* ── SECTION ── */
.sec{margin-bottom:4px;}
.sec-head{display:flex;align-items:center;gap:12px;padding:16px 0 14px;}
.sec-logo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-cr{background:linear-gradient(135deg,#6C47FF,#9B59B6);}
.logo-x{background:#000;}
.logo-meta{background:linear-gradient(135deg,#1877F2,#0C52C4);}
.sec-info{flex:1;}
.sec-title{font-size:15px;font-weight:800;color:var(--text);}
.sec-sub{font-size:11px;color:var(--sub);margin-top:2px;letter-spacing:.2px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok-b);}
.b-fail{background:var(--fail-bg);color:var(--fail);border:1.5px solid var(--fail-b);}

.vlist{display:flex;flex-direction:column;gap:10px;}
.vitem{border-radius:12px;padding:14px 16px;border:1px solid;}
.vi-cr{background:#FAF5FF;border-color:#DDD6FE;}
.vi-x{background:#F8F9FA;border-color:#D1D5DB;}
.vi-meta{background:#EFF6FF;border-color:#BFDBFE;}

.vrule{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.vr-cr{color:#7C3AED;} .vr-x{color:#111;} .vr-meta{color:#1877F2;}
.vtag{padding:2px 8px;border-radius:5px;font-size:10px;}
.vtag-cr{background:#EDE9FE;color:#6D28D9;}
.vtag-x{background:#F3F4F6;color:#374151;}
.vtag-meta{background:#DBEAFE;color:#1E40AF;}

.vrows{display:flex;flex-direction:column;gap:7px;}
.vrow{display:flex;gap:10px;align-items:flex-start;}
.vlbl{font-size:10px;font-weight:700;color:#94A3B8;min-width:54px;padding-top:3px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;}
.vval{font-size:13px;line-height:1.6;color:var(--text);}
.chip-bad{background:var(--fail-bg);color:var(--fail);padding:2px 8px;border-radius:5px;font-family:monospace;font-size:12px;}
.chip-good{background:var(--ok-bg);color:var(--ok);padding:2px 8px;border-radius:5px;font-family:monospace;font-size:12px;}

.ok-msg{font-size:13px;color:var(--ok);padding:10px 14px;background:var(--ok-bg);border-radius:8px;display:flex;align-items:center;gap:6px;}

.fixed-wrap{margin-top:14px;}
.fixed-lbl{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;}
.fixed-box{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-word;color:var(--text);position:relative;}
.copy-btn{position:absolute;top:10px;right:10px;background:var(--brand);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px;}
.copy-btn:hover{opacity:.85;}

.note{margin-top:12px;padding:12px 15px;border-radius:10px;font-size:13px;line-height:1.7;}
.note-cr{background:#FAF5FF;color:#4C1D95;border:1px solid #DDD6FE;}
.note-ok{background:var(--ok-bg);color:#065F46;border:1px solid var(--ok-b);}
.nt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;opacity:.7;}
hr{border:none;border-top:1px solid var(--border);margin:20px 0;}

/* SVGs */
.ico-x svg,.ico-meta svg,.ico-cr svg{width:20px;height:20px;display:block;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-eyebrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      お絵かきクリエイターズ
    </div>
    <h1>レギュレーションチェッカー</h1>
    <p>商標 &nbsp;·&nbsp; X（Twitter）&nbsp;·&nbsp; Meta の規約を一括チェック</p>
  </div>
</div>

<div class="main">

  <!-- 設定 -->
  <div class="card">
    <div class="clabel">媒体を選択</div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-m="banner">📌 バナー・キャッチコピー</button>
      <button class="tab" data-m="video">🎬 動画・台本・テロップ</button>
      <button class="tab" data-m="lp">📄 HP・LP・チラシ</button>
    </div>
    <div class="hint" id="hint">フル表記パターン：すべての箇所に® が必要</div>

    <div class="pf-row">
      <div class="pf-label">プラットフォーム規約チェック（任意・複数選択可）</div>

      <div class="pf-card x-card" id="pfX" onclick="togglePF('x')">
        <div class="pf-icon ico-x">
          <svg viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
        </div>
        <div class="pf-info">
          <div class="pf-name">X（Twitter）</div>
          <div class="pf-desc">広告ポリシーチェック</div>
        </div>
        <div class="pf-check" id="ckX"></div>
      </div>

      <div class="pf-card meta-card" id="pfMeta" onclick="togglePF('meta')">
        <div class="pf-icon ico-meta">
          <svg viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </div>
        <div class="pf-info">
          <div class="pf-name">Meta（Facebook / Instagram）</div>
          <div class="pf-desc">広告ポリシーチェック</div>
        </div>
        <div class="pf-check" id="ckMeta"></div>
      </div>
    </div>
  </div>

  <!-- 入力 -->
  <div class="card">
    <div class="clabel" id="inputLabel">チェックしたいテキストを貼り付け</div>

    <!-- テキスト入力 -->
    <div id="textArea">
      <textarea class="inp" id="inputText" placeholder="ここにテキストを貼り付けてください...

例：
セールスいらずのお絵かきムービーで、
認定お絵かきクリエイターになれるプログラムです。
月収30万円も夢じゃない！誰でも簡単に稼げます。"></textarea>
    </div>

    <!-- 動画URL入力 -->
    <div id="videoArea" class="video-inp">
      <!-- ソース切り替えタブ -->
      <div class="src-tabs">
        <button class="src-tab on" data-src="youtube" onclick="switchSrc('youtube')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/></svg>
          YouTube
        </button>
        <button class="src-tab" data-src="gdrive" onclick="switchSrc('gdrive')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4.41 19.94 1.28 14.5l2.96-5.17h5.92l2.96 5.17-2.96 5.44H4.41zm7.1-6.72L8.54 8h6.92l2.96 5.22H11.51zm3.43 6.72-2.96-5.44h5.92l3.13 5.44h-6.09z"/></svg>
          Google Drive
        </button>
        <button class="src-tab" data-src="file" onclick="switchSrc('file')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><polyline points="14 2 14 8 20 8"/></svg>
          MP4ファイル
        </button>
      </div>

      <!-- URL 入力（YouTube / Google Drive） -->
      <div id="urlInputWrap">
        <div class="url-wrap">
          <input class="url-field" id="videoUrl" type="url" placeholder="YouTube の URL を貼り付け">
          <button class="fetch-btn" id="fetchBtn" onclick="fetchFromUrl()">読み込む</button>
        </div>
      </div>

      <!-- ファイルアップロード -->
      <div class="drop-zone" id="dropZone">
        <input type="file" accept="video/mp4,video/*" id="videoFile" onchange="handleVideoFile(this.files[0])">
        <div class="drop-icon">🎬</div>
        <div class="drop-title">MP4ファイルをドラッグ＆ドロップ</div>
        <div class="drop-sub">または <strong>クリックしてファイルを選択</strong></div>
      </div>

      <!-- プレビュー -->
      <div class="vid-preview" id="vidPreview"></div>

      <!-- ステータス＆字幕 -->
      <div id="fetchStatus" class="fetch-status"></div>
      <div id="transcriptArea" class="transcript-area">
        <div class="transcript-label" id="transcriptLabel"></div>
        <textarea id="transcriptText" placeholder="台本・テロップのテキストをここに貼り付けてください..."></textarea>
      </div>
    </div>

    <button class="go-btn" onclick="runCheck()">チェックする　→</button>
  </div>

  <!-- 結果 -->
  <div class="card result" id="result">
    <div id="resultInner"></div>
  </div>

</div>

<script>
/* ─── Config ─── */
let media = 'banner';
let pfX = false, pfMeta = false;

const MCFG = {
  banner:{ pattern:'full',  hint:'フル表記パターン：すべての箇所に® が必要', decl:false },
  video: { pattern:'hybrid',hint:'ハイブリッドパターン：冒頭だけ® 付き・中身はカギカッコのみ・末尾に権利宣言文が必要', decl:true },
  lp:    { pattern:'hybrid',hint:'ハイブリッドパターン：冒頭だけ® 付き・中身はカギカッコのみ・末尾に権利宣言文が必要', decl:true }
};

const DECL = '※「お絵かきムービー」「お絵かきクリエイター」は株式会社アクアフィールドの登録商標です。';

/* ─── Media tabs ─── */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  b.classList.add('on');
  media = b.dataset.m;
  document.getElementById('hint').textContent = MCFG[media].hint;
  const isVideo = media === 'video';
  document.getElementById('textArea').style.display = isVideo ? 'none' : 'block';
  document.getElementById('videoArea').style.display = isVideo ? 'flex' : 'none';
  document.getElementById('inputLabel').textContent = isVideo ? '動画URLを入力' : 'チェックしたいテキストを貼り付け';
}));

/* ─── Platform toggles ─── */
function togglePF(p) {
  if (p === 'x') {
    pfX = !pfX;
    document.getElementById('pfX').classList.toggle('on', pfX);
    document.getElementById('ckX').textContent = pfX ? '✓' : '';
  } else {
    pfMeta = !pfMeta;
    document.getElementById('pfMeta').classList.toggle('on', pfMeta);
    document.getElementById('ckMeta').textContent = pfMeta ? '✓' : '';
  }
}

/* ─── Video source switching ─── */
let currentSrc = 'youtube';

function switchSrc(src) {
  currentSrc = src;
  document.querySelectorAll('.src-tab').forEach(t => t.classList.toggle('on', t.dataset.src === src));
  const urlWrap = document.getElementById('urlInputWrap');
  const dropZone = document.getElementById('dropZone');
  const urlField = document.getElementById('videoUrl');

  if (src === 'file') {
    urlWrap.style.display = 'none';
    dropZone.style.display = 'block';
  } else {
    urlWrap.style.display = 'block';
    dropZone.style.display = 'none';
    urlField.placeholder = src === 'youtube'
      ? 'YouTube の URL を貼り付け（例：https://www.youtube.com/watch?v=...）'
      : 'Google Drive の共有URL を貼り付け（例：https://drive.google.com/file/d/...）';
  }
  // リセット
  document.getElementById('vidPreview').style.display = 'none';
  document.getElementById('vidPreview').innerHTML = '';
  document.getElementById('fetchStatus').style.display = 'none';
  document.getElementById('transcriptArea').style.display = 'none';
  document.getElementById('transcriptText').value = '';
}

// ドラッグ＆ドロップ
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handleVideoFile(f); });

function handleVideoFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('vidPreview');
  preview.style.display = 'block';
  preview.innerHTML = `<video src="${url}" controls></video>`;
  setStatus('ng', '⚠ ファイルからは字幕を自動取得できません。下のテキストエリアに台本・テロップを貼り付けてください。');
  showTranscriptManual();
}

/* ─── URL fetch (YouTube / Google Drive) ─── */
function getYTId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getGDriveId(url) {
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function fetchFromUrl() {
  const url = document.getElementById('videoUrl').value.trim();
  const btn = document.getElementById('fetchBtn');
  if (!url) { setStatus('error', 'URLを入力してください。'); return; }

  if (currentSrc === 'youtube' || getYTId(url)) {
    await fetchYouTube(url, btn);
  } else if (currentSrc === 'gdrive' || url.includes('drive.google.com')) {
    fetchGDrive(url);
  } else {
    setStatus('error', '対応しているURLを入力してください（YouTube または Google Drive）。');
  }
}

async function fetchYouTube(url, btn) {
  const vid = getYTId(url);
  if (!vid) { setStatus('error', 'YouTube の URL を正しく入力してください。'); return; }

  const preview = document.getElementById('vidPreview');
  preview.style.display = 'block';
  preview.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;

  btn.disabled = true;
  btn.textContent = '取得中...';
  setStatus('loading', '字幕データを取得中...');
  document.getElementById('transcriptArea').style.display = 'none';

  const transcript = await tryFetchTranscript(vid);
  btn.disabled = false;
  btn.textContent = '読み込む';

  if (transcript && transcript.trim().length > 10) {
    setStatus('ok', `✓ 字幕を取得しました（${transcript.length}文字）。そのままチェックできます。`);
    document.getElementById('transcriptText').value = transcript;
    document.getElementById('transcriptLabel').textContent = '取得した字幕テキスト（編集できます）';
    document.getElementById('transcriptArea').style.display = 'block';
  } else {
    setStatus('ng', '⚠ 字幕の自動取得に失敗しました。下のテキストエリアに台本・テロップを手動で貼り付けてください。');
    showTranscriptManual();
  }
}

function fetchGDrive(url) {
  const id = getGDriveId(url);
  if (!id) { setStatus('error', 'Google Drive の URL を正しく入力してください。共有リンクをそのまま貼り付けてください。'); return; }

  const preview = document.getElementById('vidPreview');
  preview.style.display = 'block';
  preview.innerHTML = `<iframe src="https://drive.google.com/file/d/${id}/preview" allowfullscreen></iframe>`;

  setStatus('ng', '⚠ Google Drive からは字幕を自動取得できません。下のテキストエリアに台本・テロップを貼り付けてください。');
  showTranscriptManual();
}

function showTranscriptManual() {
  document.getElementById('transcriptLabel').textContent = '台本・テロップを手動で貼り付け';
  document.getElementById('transcriptArea').style.display = 'block';
}

async function tryFetchTranscript(vid) {
  const proxies = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
  ];

  for (const proxy of proxies) {
    try {
      const listUrl = proxy(`https://www.youtube.com/api/timedtext?type=list&v=${vid}`);
      const listRes = await fetch(listUrl, { signal: AbortSignal.timeout(6000) });
      if (!listRes.ok) continue;
      const listXml = await listRes.text();
      const doc = new DOMParser().parseFromString(listXml, 'text/xml');
      const tracks = Array.from(doc.querySelectorAll('track'));
      if (!tracks.length) continue;

      const track = tracks.find(t => t.getAttribute('lang_code') === 'ja')
                 || tracks.find(t => t.getAttribute('lang_code')?.startsWith('ja'))
                 || tracks[0];
      if (!track) continue;

      const lang = track.getAttribute('lang_code');
      const name = encodeURIComponent(track.getAttribute('name') || '');
      const tUrl = proxy(`https://www.youtube.com/api/timedtext?lang=${lang}&name=${name}&v=${vid}&fmt=json3`);
      const tRes = await fetch(tUrl, { signal: AbortSignal.timeout(8000) });
      if (!tRes.ok) continue;

      const data = await tRes.json();
      if (!data.events) continue;

      return data.events
        .filter(e => e.segs)
        .map(e => e.segs.map(s => s.utf8 || '').join(''))
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    } catch(e) { continue; }
  }
  return null;
}

function setStatus(type, msg) {
  const el = document.getElementById('fetchStatus');
  el.className = `fetch-status ${type === 'loading' ? 'loading' : type === 'ok' ? 'ok' : 'ng'}`;
  el.style.display = 'block';
  el.textContent = msg;
}

/* ─── Main check ─── */
function runCheck() {
  let text;
  if (media === 'video') {
    text = document.getElementById('transcriptText').value.trim();
    if (!text) { alert('字幕を取得するか、テキストを手動で入力してください。'); return; }
  } else {
    text = document.getElementById('inputText').value.trim();
    if (!text) { alert('テキストを入力してください。'); return; }
  }

  const cfg = MCFG[media];
  const crV = getCR(text, cfg);
  const fixed = getFixed(text, cfg);
  const xV  = pfX    ? getPF(text, X_RULES)    : null;
  const metaV = pfMeta ? getPF(text, META_RULES) : null;

  render(text, crV, fixed, xV, metaV, cfg);
}

/* ─── CR check ─── */
function getCR(text, cfg) {
  const v = [];
  [...text.matchAll(/お絵描き/g)].forEach(m => v.push({ rule:'漢字表記NG', bad:m[0], good:'お絵かき', ctx:c(text,m.index,m[0].length), desc:'「かき」はひらがなが正しい。「描き」（漢字）はNGです。' }));
  [...text.matchAll(/オエカキム[ーー－]ビ[ーー]/g)].forEach(m => v.push({ rule:'カタカナ表記NG', bad:m[0], good:'「お絵かきムービー®」', ctx:c(text,m.index,m[0].length), desc:'カタカナ表記はNGです。' }));
  [...text.matchAll(/お絵ム[ーー]/g)].forEach(m => v.push({ rule:'略称NG', bad:m[0], good:'「お絵かきムービー®」', ctx:c(text,m.index,m[0].length), desc:'略称はNGです。正式名称を使ってください。' }));
  [...text.matchAll(/認定お絵かきクリエイター/g)].forEach(m => v.push({ rule:'「認定」使用NG', bad:m[0], good:'「お絵かきクリエイター®」', ctx:c(text,m.index,m[0].length), desc:'「認定」という接頭語はNGです。' }));
  chkTM(text,'お絵かきムービー',cfg.pattern,v);
  chkTM(text,'お絵かきクリエイター',cfg.pattern,v);
  const seen=new Set(); return v.filter(x=>{ const k=x.rule+x.bad; if(seen.has(k))return false; seen.add(k); return true; });
}

function chkTM(text,name,pattern,v) {
  const re=new RegExp(name,'g'); let m;
  while((m=re.exec(text))!==null){
    const i=m.index,l=m[0].length;
    if(text[i-1]!=='「'){
      v.push({ rule:'カギカッコなし', bad:text.substring(Math.max(0,i-3),i+l+3), good:pattern==='full'?`「${name}®」`:`「${name}®」（冒頭）または「${name}」（中盤）`, ctx:c(text,i,l), desc:`「${name}」はカギカッコ（「」）で囲んでください。` }); return;
    }
    if(pattern==='full' && text[i+l]!=='®')
      v.push({ rule:'® マーク欠落', bad:`「${name}」`, good:`「${name}®」`, ctx:c(text,i-1,l+2), desc:'バナー・キャッチコピーはすべての箇所に®が必要です。' });
  }
}

function getFixed(text,cfg){
  let f=text.replace(/お絵描き/g,'お絵かき').replace(/認定お絵かきクリエイター/g,'「お絵かきクリエイター®」');
  const af=(t,name,pat)=>{
    const e=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp(`(?<!「)${e}(?![」®])`,'g'),`「${name}®」`);
    if(pat==='full') t=t.replace(new RegExp(`「${e}」(?!®)`,'g'),`「${name}®」`);
    return t;
  };
  f=af(f,'お絵かきムービー',cfg.pattern);
  f=af(f,'お絵かきクリエイター',cfg.pattern);
  return f;
}

/* ─── Platform rules ─── */
const X_RULES=[
  { rule:'具体的な収入保証', pat:/月[収入]?\s*[0-9０-９]+\s*万[円]|年[収入]?\s*[0-9０-９]+\s*万[円]/g, desc:'具体的な収入金額を保証・約束する表現はNGです。', fix:'「収入アップを目指せる」など可能性を示す表現に変更してください。' },
  { rule:'成果・成功の保証', pat:/(?:必ず|絶対に?|確実に?)\s*(?:稼|儲|成功|収入|売れ)/g, desc:'「必ず」「絶対」など100%の保証表現はNGです。', fix:'「目指せる」「可能性がある」などに変更してください。' },
  { rule:'「誰でも簡単に稼げる」系表現', pat:/誰[でもとが]\s*(?:簡単に?|すぐに?|楽に?)\s*(?:稼|儲|収入|お金)/g, desc:'誰でも簡単に稼げるという誇大表現はNGです。', fix:'「初心者でも取り組みやすい」など具体的な特徴を示してください。' },
  { rule:'スキル不要で稼げる表現', pat:/(?:スキル|経験|知識)\s*(?:なし|不要|ゼロ|０)\s*で\s*(?:稼|儲|収入)/g, desc:'スキル・経験不要で収入が得られるという誇大表現はNGです。', fix:'「未経験から始められる」などサポート体制を示してください。' },
  { rule:'扇情的・誇大キャッチコピー', pat:/(?:衝撃|驚異|奇跡|禁断|極秘|裏技)の(?:方法|稼ぎ方|ノウハウ)/g, desc:'「衝撃の方法」「禁断の稼ぎ方」など扇情的な表現はNGです。', fix:'サービスの具体的な特徴を正直に伝える表現にしてください。' }
];

const META_RULES=[
  { rule:'個人属性への直接言及', pat:/(?:収入|お金|給料)\s*が\s*(?:少ない|足りない|ない|低い)\s*(?:方|人|あなた)|(?:副業|在宅)\s*を\s*(?:探して|お探し)\s*(?:いる|の)?\s*(?:方|人|あなた)/g, desc:'個人の財務状況・状態を直接言及するのはMeta広告ポリシー違反です。', fix:'「副業に興味がある方」など中立的な表現にしてください。' },
  { rule:'収入の保証・約束', pat:/月[収入]?\s*[0-9０-９]+\s*万[円]|年[収入]?\s*[0-9０-９]+\s*万[円]|(?:必ず|絶対に?)\s*(?:稼|儲|収入)/g, desc:'具体的な収入数字の保証はMeta広告ポリシー違反になります。', fix:'「※個人の結果には差があります」を明記するか、収入保証表現を避けてください。' },
  { rule:'証明できない最上級表現', pat:/(?:日本|国内|業界)\s*(?:最大|最高|No\.?1|ナンバーワン|一位)/g, desc:'「日本最大」「業界No.1」など証明できない最上級表現はNGです。', fix:'根拠のある具体的な数字か、表現を削除してください。' },
  { rule:'極端なビフォーアフター', pat:/(?:[0-9０-９]+\s*万円?)?\s*(?:から|→|⇒)\s*(?:月[収入]?\s*)?[0-9０-９]+\s*万[円]|月収\s*[0-9０-９]+\s*倍/g, desc:'極端な成果の変化を示す表現はMetaで制限される場合があります。', fix:'個人の実績として明記し、「※成果には個人差があります」を追記してください。' },
  { rule:'過度な緊急性・希少性の煽り', pat:/(?:今だけ|今すぐ|残り[0-9０-９]+名|限定[0-9０-９]+名)/g, desc:'「今だけ！」「残り○名！」など過度な煽り表現はMeta審査で問題になる場合があります。', fix:'事実に基づく期限・定員情報のみを記載し、強調表現を控えてください。' }
];

function getPF(text, rules) {
  const v = [];
  rules.forEach(r => {
    r.pat.lastIndex = 0;
    const ms = [...text.matchAll(r.pat)];
    if (ms.length) v.push({ rule:r.rule, bad:ms[0][0], fix:r.fix, desc:r.desc, ctx:c(text,ms[0].index,ms[0][0].length) });
  });
  return v;
}

/* ─── Render ─── */
function render(text, crV, fixed, xV, metaV, cfg) {
  const rc = document.getElementById('result');
  rc.style.display = 'block';
  const hasDecl = text.includes('株式会社アクアフィールドの登録商標') || text.includes('登録商標');
  const allOk = crV.length===0 && (xV===null||xV.length===0) && (metaV===null||metaV.length===0);

  let html = '';

  if (allOk) {
    html += `<div class="pass-all"><div class="e">✅</div><h3>すべての項目で合格！</h3><p>商標・プラットフォーム規約に違反は見つかりませんでした。</p></div>`;
    if (cfg.decl && !hasDecl) html += noteHtml('cr','権利宣言文を末尾に追加してください', `コピペ用：<br><br>${esc(DECL)}`);
  } else {
    // CR
    html += secHtml({
      logoClass:'logo-cr',
      logoSvg:`<svg viewBox="0 0 24 24" fill="white" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="900" font-family="serif">®</text></svg>`,
      title:'商標レギュレーション', sub:'お絵かきクリエイターズ 社内規定',
      violations:crV, iclass:'vi-cr', rclass:'vr-cr', tclass:'vtag-cr',
      passText:'商標表記に問題はありません。',
      fixed: crV.length ? fixed : null
    });
    if (cfg.decl) {
      html += hasDecl
        ? noteHtml('ok','権利宣言文 ✓ 確認済み','権利宣言文が含まれています。')
        : noteHtml('cr','権利宣言文を追加してください', `末尾に以下を追記：<br><br>${esc(DECL)}`);
    }

    // X
    if (xV !== null) {
      html += '<hr>';
      html += secHtml({
        logoClass:'logo-x',
        logoSvg:`<svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>`,
        title:'X（Twitter）広告ポリシー', sub:'収入表現・保証・誇大広告チェック',
        violations:xV, iclass:'vi-x', rclass:'vr-x', tclass:'vtag-x',
        passText:'X広告ポリシーに問題は見つかりませんでした。',
        fixed: null
      });
    }

    // Meta
    if (metaV !== null) {
      html += '<hr>';
      html += secHtml({
        logoClass:'logo-meta',
        logoSvg:`<svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`,
        title:'Meta（Facebook / Instagram）広告ポリシー', sub:'個人属性・誇大表現・収入表現チェック',
        violations:metaV, iclass:'vi-meta', rclass:'vr-meta', tclass:'vtag-meta',
        passText:'Meta広告ポリシーに問題は見つかりませんでした。',
        fixed: null
      });
    }
  }

  document.getElementById('resultInner').innerHTML = html;
  rc.scrollIntoView({ behavior:'smooth', block:'start' });
}

function secHtml({ logoClass, logoSvg, title, sub, violations, iclass, rclass, tclass, passText, fixed }) {
  const badge = violations.length === 0
    ? `<span class="badge b-ok">✓ 合格</span>`
    : `<span class="badge b-fail">⚠ ${violations.length}件の違反</span>`;
  let h = `<div class="sec"><div class="sec-head"><div class="sec-logo ${logoClass}">${logoSvg}</div><div class="sec-info"><div class="sec-title">${esc(title)}</div><div class="sec-sub">${esc(sub)}</div></div>${badge}</div>`;
  if (violations.length === 0) {
    h += `<div class="ok-msg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>${esc(passText)}</div>`;
  } else {
    h += `<div class="vlist">`;
    violations.forEach((v,i) => {
      h += `<div class="vitem ${iclass}">
        <div class="vrule ${rclass}"><span class="vtag ${tclass}">違反 ${i+1}</span> ${esc(v.rule)}</div>
        <div class="vrows">
          <div class="vrow"><span class="vlbl">該当箇所</span><span class="vval"><span class="chip-bad">${esc(v.ctx)}</span></span></div>
          <div class="vrow"><span class="vlbl">説明</span><span class="vval">${esc(v.desc)}</span></div>
          <div class="vrow"><span class="vlbl">修正案</span><span class="vval"><span class="chip-good">${esc(v.fix||v.good||'')}</span></span></div>
        </div>
      </div>`;
    });
    h += `</div>`;
    if (fixed) h += `<div class="fixed-wrap"><div class="fixed-lbl">修正済み全文</div><div class="fixed-box"><button class="copy-btn" onclick="doCopy(this)">コピー</button><span>${esc(fixed)}</span></div></div>`;
  }
  h += `</div>`;
  return h;
}

function noteHtml(type, title, body) {
  return `<div class="note note-${type}"><div class="nt">${esc(title)}</div>${body}</div>`;
}

/* ─── Helpers ─── */
function c(text,i,l){ const s=Math.max(0,i-8),e=Math.min(text.length,i+l+8); return (s>0?'…':'')+text.substring(s,e)+(e<text.length?'…':''); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function doCopy(btn){ navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(()=>{ btn.textContent='✓ コピー済み'; setTimeout(()=>btn.textContent='コピー',1800); }); }
</script>
